                <button class="hamburger" aria-label="Toggle menu">

            <section class="hero">

                <div class="comics-grid" id="comics-grid">

    <script>
        // To add a new comic: save the image as
        // /assets/images/archive-page/cnes-comic-<n>.avif
        // then add one entry below with its date and Instagram link.
        const comics = [
            { number: 1, date: "April 16, 2026", link: "https://www.instagram.com/p/DXNDD11Eees" },
            { number: 2, date: "May 2, 2026", link: "https://www.instagram.com/p/DX2GEdSkcZ8" },
            { number: 3, date: "May 2, 2026", link: "https://www.instagram.com/p/DX2Gu2FkePV" },
            { number: 4, date: "June 2, 2026", link: "https://www.instagram.com/p/DZFmmpIEenI/" },
            { number: 5, date: "July 22, 2026", link: "https://www.instagram.com/p/DbGtEXcEVkD/" },
            { number: 6, date: "September 12, 2026", link: "https://www.instagram.com/p/DdMekDAkRsR" }
        ];

        const grid = document.getElementById('comics-grid');
        comics.forEach(comic => {
            const item = document.createElement('a');
            item.className = 'comic-item';
            item.href = comic.link;
            item.target = '_blank';
            item.rel = 'noopener noreferrer';

            const img = document.createElement('img');
            img.src = `/assets/images/archive-page/cnes-comic-${comic.number}.png`;
            img.alt = `CNES comic ${comic.number}, posted ${comic.date}`;
            img.loading = 'lazy';

            const caption = document.createElement('span');
            caption.className = 'comic-date';
            caption.textContent = comic.date;

            item.appendChild(img);
            item.appendChild(caption);
            grid.appendChild(item);
        });
    </script>
    
</body>
